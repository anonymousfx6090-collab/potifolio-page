<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY POTIFOLIO PAGE || SKILLS</title>
    <link rel="stylesheet" href="skills.css">
</head>
<body>

    <div>
      <h5>My Professional</h5>
      <h2>Background Skills and<br>Accomplishments</h2>
    </div>

  </div>

  <!-- ICONS -->
  <div class="icon-row">

    <div class="icon">📄</div>
    <div class="icon">🎯</div>

        <span>UI Design</span>

    <div class="right">
      <div class="skill">
        <span>GitHub</span>
        <span>10%</span>

      </div>

      <div class="skill">
        <span>Tailwind</span>
        <span>20%</span>

      <!-- TOOLS -->
      <div class="tools">
        <span>HTML</span>
        <span>CSS</span>
